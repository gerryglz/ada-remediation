name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify private release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const pkg=require("./package.json"); if(pkg.private!==true) throw new Error("package.json must remain private"); if(process.env.RELEASE_TAG!==`v${pkg.version}`) throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${pkg.version}`);'
      - name: Build npm package
        id: package
        shell: bash
        run: |
          package_file="$(npm pack --silent)"
          echo "file=${package_file}" >> "${GITHUB_OUTPUT}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.file }}#npm package" \
            --verify-tag \
            --generate-notes \
            --title "ADA Remediation ${GITHUB_REF_NAME}"
