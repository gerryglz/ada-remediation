<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auto-rotating carousel fixture</title>
</head>
<body>
  <main>
    <h1>Auto-rotating carousel fixture</h1>
    <section id="news-carousel" role="region" aria-roledescription="carousel" aria-label="Latest news">
      <button id="previous-news" type="button" aria-controls="news-carousel">Previous slide</button>
      <button id="pause-news" type="button">Pause rotation</button>
      <div role="group" aria-roledescription="slide" aria-label="1 of 2">First story</div>
      <div role="group" aria-roledescription="slide" aria-label="2 of 2" hidden>Second story</div>
      <button id="next-news" type="button" aria-controls="news-carousel">Next slide</button>
    </section>
  </main>
</body>
</html>
